name: Daily site refresh

on:
  schedule:
    # Three post-close attempts because GitHub schedule delivery is best-effort.
    # The stable automation branch + PR deduplication makes backstops idempotent.
    - cron: '5 21 * * 1-5'
    - cron: '35 22 * * 1-5'
    - cron: '35 0 * * 2-6'
  workflow_dispatch:

# The built-in token only reads the repository. Mutations use a dedicated
# GitHub App installation token scoped to this repository.
permissions:
  contents: read

concurrency:
  group: daily-refresh
  cancel-in-progress: false

env:
  AUTOMATION_BRANCH: automation/performance-series-v2
  GENERATED_PATH: tracking/performance-series.json
  AUTOMATION_CUTOVER_ENABLED: ${{ vars.AUTOMATION_CUTOVER_ENABLED }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require approved cutover gate
        run: |
          if [ "$AUTOMATION_CUTOVER_ENABLED" != "true" ]; then
            echo "::error::AUTOMATION_CUTOVER_ENABLED is not true"
            exit 1
          fi

      - name: Create repository-scoped automation token
        id: app_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AI_STOCKS_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AI_STOCKS_AUTOMATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Rebuild performance series
        run: |
          for i in 1 2 3; do
            python scripts/track_performance.py --series-only && exit 0
            echo "attempt $i failed; retrying in 60s"
            sleep 60
          done
          echo "::error::yfinance failed after 3 attempts; published data is unchanged"
          exit 1

      - name: Validate generated data
        run: python -m pytest tests -q

      - name: Detect generated change
        id: changed
        run: |
          if git diff --quiet -- "$GENERATED_PATH"; then
            echo "value=false" >> "$GITHUB_OUTPUT"
            echo "series unchanged; no PR update needed"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Plan generated-data PR
        if: steps.changed.outputs.value == 'true'
        id: plan
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          branch_exists=false
          remote_commit=""
          branch_sha=""
          if git fetch origin "$AUTOMATION_BRANCH"; then
            branch_exists=true
            remote_commit=$(git rev-parse "origin/$AUTOMATION_BRANCH")
            branch_sha=$(git show "origin/$AUTOMATION_BRANCH:$GENERATED_PATH" \
              | shasum -a 256 | cut -d ' ' -f 1)
          fi

          desired_sha=$(shasum -a 256 "$GENERATED_PATH" | cut -d ' ' -f 1)
          listed=$(gh pr list --state open --head "$AUTOMATION_BRANCH" \
            --json number,headRefName,baseRefName,mergeStateStatus,statusCheckRollup)
          count=$(jq 'length' <<<"$listed")
          prs="$listed"
          if [ "$count" -eq 1 ]; then
            number=$(jq -r '.[0].number' <<<"$listed")
            detail=$(gh pr view "$number" \
              --json number,headRefName,baseRefName,mergeStateStatus,statusCheckRollup,files)
            prs=$(jq -n --argjson pr "$detail" '[$pr]')
          fi

          jq -n \
            --argjson prs "$prs" \
            --argjson branch_exists "$branch_exists" \
            --arg desired_sha "$desired_sha" \
            --arg branch_sha "$branch_sha" \
            '{prs: $prs, branch_exists: $branch_exists,
              desired_sha: $desired_sha,
              branch_sha: (if $branch_sha == "" then null else $branch_sha end)}' \
            > /tmp/generated-pr-input.json

          python scripts/generated_data_pr.py \
            --input /tmp/generated-pr-input.json \
            --automation-branch "$AUTOMATION_BRANCH" \
            --github-output "$GITHUB_OUTPUT"
          echo "remote_commit=$remote_commit" >> "$GITHUB_OUTPUT"
          asof=$(python -c \
            "import json; print(json.load(open('$GENERATED_PATH'))['as_of'])")
          echo "asof=$asof" >> "$GITHUB_OUTPUT"

      - name: Commit series if changed
        if: >-
          steps.changed.outputs.value == 'true' &&
          (steps.plan.outputs.action == 'create' || steps.plan.outputs.action == 'update')
        run: |
          git config user.name 'ai-stocks-automation[bot]'
          git config user.email 'ai-stocks-automation[bot]@users.noreply.github.com'
          git add -- "$GENERATED_PATH"
          git commit -m "chore(data): daily performance series ${{ steps.plan.outputs.asof }}"

          if [ "${{ steps.plan.outputs.action }}" = "update" ]; then
            git push \
              --force-with-lease="refs/heads/$AUTOMATION_BRANCH:${{ steps.plan.outputs.remote_commit }}" \
              origin "HEAD:refs/heads/$AUTOMATION_BRANCH"
          else
            git push origin "HEAD:refs/heads/$AUTOMATION_BRANCH"
          fi

      - name: Create or locate generated-data PR
        if: steps.changed.outputs.value == 'true'
        id: generated_pr
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          if [ "${{ steps.plan.outputs.action }}" = "create" ]; then
            gh pr create \
              --base main \
              --head "$AUTOMATION_BRANCH" \
              --title "chore(data): daily performance series" \
              --body "Automated single-file update for \`$GENERATED_PATH\`. Full tests must pass in the PR-associated \`pull_request\` run before auto-merge."
          fi

          number=$(gh pr list --state open --head "$AUTOMATION_BRANCH" \
            --json number --jq 'if length == 1 then .[0].number else error("expected one automation PR") end')
          head_sha=$(gh pr view "$number" --json headRefOid --jq '.headRefOid')

          if [ "${{ steps.plan.outputs.action }}" = "create" ] || \
             [ "${{ steps.plan.outputs.action }}" = "update" ]; then
            expected_sha=$(git rev-parse HEAD)
          else
            expected_sha="${{ steps.plan.outputs.remote_commit }}"
          fi
          if [ "$head_sha" != "$expected_sha" ]; then
            echo "::error::PR head $head_sha does not match planned head $expected_sha"
            exit 1
          fi

          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Require PR-associated test and auto-merge
        if: steps.changed.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          PR_NUMBER: ${{ steps.generated_pr.outputs.number }}
          PR_HEAD_SHA: ${{ steps.generated_pr.outputs.head_sha }}
        run: |
          found=false
          for attempt in {1..30}; do
            checks=$(gh pr checks "$PR_NUMBER" --required \
              --json name,state,bucket,event,workflow 2>/dev/null || true)
            if jq -e 'any(.[]; .name == "test" and .event == "pull_request")' \
                <<<"$checks" >/dev/null; then
              found=true
              break
            fi
            sleep 2
          done
          if [ "$found" != true ]; then
            echo "::error::PR-associated required test did not appear"
            exit 1
          fi

          gh pr checks "$PR_NUMBER" --required --watch --fail-fast --interval 5
          checks=$(gh pr checks "$PR_NUMBER" --required \
            --json name,state,bucket,event,workflow)
          if ! jq -e \
              'any(.[]; .name == "test" and .event == "pull_request" and
                         .bucket == "pass")' <<<"$checks" >/dev/null; then
            echo "::error::required test did not pass in pull_request context"
            exit 1
          fi

          check_runs=$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$PR_HEAD_SHA/check-runs?filter=latest")
          if ! jq -e --argjson pr "$PR_NUMBER" \
              'any(.check_runs[]; .name == "test" and .app.id == 15368 and
                                   .conclusion == "success" and
                                   any(.pull_requests[]; .number == $pr))' \
              <<<"$check_runs" >/dev/null; then
            echo "::error::required test was not reported by GitHub Actions app 15368"
            exit 1
          fi

          current_head=$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')
          if [ "$current_head" != "$PR_HEAD_SHA" ]; then
            echo "::error::PR head changed while tests were running"
            exit 1
          fi

          gh pr merge --auto --squash "$PR_NUMBER" \
            --match-head-commit "$PR_HEAD_SHA"

          merged=false
          for attempt in {1..60}; do
            state=$(gh pr view "$PR_NUMBER" --json state --jq '.state')
            if [ "$state" = "MERGED" ]; then
              merged=true
              break
            fi
            sleep 2
          done
          if [ "$merged" != true ]; then
            echo "::error::automation PR did not merge after required test passed"
            exit 1
          fi

          merge_sha=$(gh pr view "$PR_NUMBER" --json mergeCommit --jq '.mergeCommit.oid')
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')
          if [ "$merge_sha" != "$main_sha" ]; then
            echo "::error::main moved after automation merge; refusing ambiguous deploy verification"
            exit 1
          fi

          deploy_run_id=""
          for attempt in {1..30}; do
            deploy_run_id=$(gh run list --workflow deploy-site.yml \
              --commit "$merge_sha" --event push --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$deploy_run_id" ]; then
              break
            fi
            sleep 2
          done
          if [ -z "$deploy_run_id" ]; then
            echo "::error::merge push did not trigger deployment"
            exit 1
          fi
          gh run watch "$deploy_run_id" --exit-status
