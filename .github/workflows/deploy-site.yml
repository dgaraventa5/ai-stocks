name: Deploy portfolio site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install openpyxl pytest
      # Runs after merge, so it cannot stop a stale commit: the rule-25 gate
      # is enforced on the PR, and here would only block publishing.
      - run: python -m pytest tests -q --deselect tests/test_targets_reweight_gate.py::test_targets_reflect_current_scores
      - run: python scripts/export_site_data.py
      - run: python scripts/check_site.py
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=ai-supply-chain
