name: Pull request CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install -r requirements.txt pytest
      # The rule-25 gate stays on for every PR except the automated
      # performance-series PR, which only changes that one generated file.
      - name: Run full test suite
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" = "automation/performance-series-v2" ] && \
             [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            python -m pytest tests -q --deselect tests/test_targets_reweight_gate.py::test_targets_reflect_current_scores
          else
            python -m pytest tests -q
          fi
