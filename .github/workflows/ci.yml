name: Pull request CI

on:
  pull_request:
    paths-ignore:
      - tracking/performance-series.json
  # GITHUB_TOKEN-authored PR events require approval. The daily writer uses
  # this documented recursion exception so `test` attaches to the PR head SHA.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install -r requirements.txt pytest
      - name: Run full test suite
        run: python -m pytest tests -q
